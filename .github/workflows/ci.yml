name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify deployment isolation
        shell: bash
        run: |
          if git grep -n -E 'saevio\.top|bark\.saevio|eew\.saevio'; then
            echo "production-specific domain found in open-source tree" >&2
            exit 1
          fi

      - name: Verify maintainer documentation
        shell: bash
        run: |
          test -s CONTRIBUTING.md
          test -s docs/BRANCH_AND_RELEASE_WORKFLOW.md
          test -s docs/OPEN_SOURCE_DEPLOYMENT.md
          test -s docs/CHANGE_CHECKLIST.md
          grep -Fq 'docs/OPEN_SOURCE_DEPLOYMENT.md' README.md
          grep -Fq 'docs/BRANCH_AND_RELEASE_WORKFLOW.md' README.md

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"
          cache: true

      - name: Verify modules
        run: |
          go mod verify
          go mod tidy -diff

      - name: Test
        run: go test ./...

      - name: Race detector
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Scan reachable vulnerabilities
        run: govulncheck ./...

      - name: Build production image
        run: docker build --pull --tag eew-bark:ci .

      - name: Build hardened Bark image
        run: docker build --pull --tag bark-server:eew-ci bark-server-patch

      - name: Build production binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build \
            -trimpath \
            -ldflags="-s -w -buildid=" \
            -o dist/eew-bark-linux-amd64 \
            .

      - name: Upload production binary
        uses: actions/upload-artifact@v4
        with:
          name: eew-bark-linux-amd64
          path: dist/eew-bark-linux-amd64
          if-no-files-found: error
          retention-days: 14
