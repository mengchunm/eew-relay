services:
  postgres:
    image: ghcr.io/mengchunm/eew-relay-geodata@sha256:6b58966124bf8fd05aa12fd45be5df76ad3fffd26b48fd4456c159698a62f481
    container_name: eew-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: eew
      POSTGRES_USER: eew
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=192MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=30
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks: [eew]
    mem_limit: 256m
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(cat /proc/1/comm)\" = postgres && psql -U eew -d eew -Atqc \"SELECT 1 WHERE to_regclass('public.eew_admin_boundary_parts_level_gid_idx') IS NOT NULL AND EXISTS (SELECT 1 FROM eew_admin_boundary_metadata)\" | grep -qx 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  eew-bark:
    image: ghcr.io/mengchunm/eew-relay:latest
    container_name: eew-bark
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:30010:30010"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
    environment:
      TZ: Asia/Shanghai
      EEW_POSTGRES_DSN: "postgres://eew:${POSTGRES_PASSWORD}@postgres:5432/eew?sslmode=disable"
      EEW_BARK_DEVICE_DSN: ${EEW_BARK_DEVICE_DSN:-}
      EEW_ADMIN_USERNAME: ${EEW_ADMIN_USERNAME:-}
      EEW_ADMIN_PASSWORD: ${EEW_ADMIN_PASSWORD:-}
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 512m
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:30010/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [eew]

networks:
  eew:
    name: eew-relay
